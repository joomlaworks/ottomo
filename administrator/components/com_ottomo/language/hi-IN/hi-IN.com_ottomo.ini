COM_OTTOMO_CONFIRM_DELETE_NEWSLETTERS="चुने गए कैंपेन और उनकी सामग्री हटाएँ? उनके आँकड़े कुल योग में बने रहेंगे। इसे पूर्ववत नहीं किया जा सकता।"
COM_OTTOMO_CONFIRM_DELETE_SUBSCRIBERS="चुने गए सब्सक्राइबर स्थायी रूप से हटाएँ? किसी को ईमेल भेजना बंद करने के लिए उन्हें अक्षम करें: अनसब्सक्राइब किया गया पता रखा जाता है ताकि उसे फिर कभी ईमेल न भेजा जाए। इसे पूर्ववत नहीं किया जा सकता।"
COM_OTTOMO_CONFIRM_DELETE_TEMPLATES="चुने गए टेम्पलेट और उनकी फ़ाइलें हटाएँ? किसी कैंपेन द्वारा उपयोग किए जा रहे टेम्पलेट रखे जाएँगे। इसे पूर्ववत नहीं किया जा सकता।"
COM_OTTOMO_CONFIRM_DELETE_TOPICS="चुने गए विषय हटाएँ? उनके सब्सक्राइबर बने रहेंगे (इन विषयों के बिना), और कैंपेन से ये प्राप्तकर्ता के रूप में हट जाएँगे। इसे पूर्ववत नहीं किया जा सकता।"
COM_OTTOMO_CONFIRM_DELETE_UNSUBSCRIBED="सभी अनसब्सक्राइब किए गए पते (%s) हटाएँ? इसे पूर्ववत नहीं किया जा सकता, और Ottomo को अब पता नहीं रहेगा कि उन्होंने अनसब्सक्राइब किया था: कोई इम्पोर्ट उन्हें फिर से जोड़ सकता है।"
