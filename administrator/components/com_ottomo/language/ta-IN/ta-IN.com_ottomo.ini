COM_OTTOMO_WELCOME="Ottomo வுக்கு வரவேற்கிறோம்,"
COM_OTTOMO_WELCOME_DESCRIPTION="Ottomo மூலம் மின்னஞ்சல் பிரச்சாரங்களை எளிதாக உருவாக்கி நிர்வகிக்கலாம். <br />மேலே உள்ள பொத்தான்களைக் கிளிக் செய்து <a href='index.php?option=com_ottomo&amp;view=newsletters'>உங்கள் முதல் பிரச்சாரத்தைத் தொடங்குங்கள்</a> அல்லது மேலும் அறிய <a href='#'>ஆவணங்களைப் படியுங்கள்</a>."
COM_OTTOMO_WHY_MESSAGE="ஏன் இந்த மின்னஞ்சல்"
COM_OTTOMO_WHY_MESSAGE_DESC="வாசகர் ஏன் இந்த மின்னஞ்சலைப் பெறுகிறார் என்று ஒவ்வொரு மின்னஞ்சலும் காட்டும் வரியை மாற்றும் (இயல்பாக: “நீங்கள் [தளப் பெயர்] தளத்தில் [தலைப்புகள்] என்பதற்குச் சந்தா செலுத்தியதால் இந்த மின்னஞ்சலைப் பெறுகிறீர்கள்.”). முகவரிகள் வேறு இடத்திலிருந்து வந்தபோது பயனுள்ளது, எ.கா. உங்கள் கருத்துக்களம் அல்லது கடை. இங்கே ப்ளேஸ்ஹோல்டர்கள் வேலை செய்யும்: {{sitename}}, {{topics}}, {{firstname|there}}. காலியாக இருந்தால்: இயல்புநிலை வரி."
COM_OTTOMO_WHY_MESSAGE_HINT="எங்கள் கருத்துக்கள உறுப்பினர் என்பதால் இந்த மின்னஞ்சலைப் பெறுகிறீர்கள்."
