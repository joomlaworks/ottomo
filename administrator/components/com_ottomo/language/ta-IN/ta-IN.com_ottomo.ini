COM_OTTOMO_CONFIRM_DELETE_NEWSLETTERS="தேர்ந்தெடுத்த பிரச்சாரங்களையும் அவற்றின் உள்ளடக்கத்தையும் நீக்கவா? அவற்றின் புள்ளிவிவரங்கள் மொத்தங்களில் இருக்கும். இதைத் திரும்பப் பெற முடியாது."
COM_OTTOMO_CONFIRM_DELETE_SUBSCRIBERS="தேர்ந்தெடுத்த சந்தாதாரர்களை நிரந்தரமாக நீக்கவா? ஒருவருக்கு மின்னஞ்சல் அனுப்புவதை நிறுத்த, அவரை முடக்கவும்: சந்தாவை நிறுத்திய முகவரி மீண்டும் ஒருபோதும் மின்னஞ்சல் பெறாதபடி வைக்கப்படும். இதைத் திரும்பப் பெற முடியாது."
COM_OTTOMO_CONFIRM_DELETE_TEMPLATES="தேர்ந்தெடுத்த வார்ப்புருக்களையும் அவற்றின் கோப்புகளையும் நீக்கவா? ஏதேனும் பிரச்சாரம் பயன்படுத்தும் வார்ப்புருக்கள் வைக்கப்படும். இதைத் திரும்பப் பெற முடியாது."
COM_OTTOMO_CONFIRM_DELETE_TOPICS="தேர்ந்தெடுத்த தலைப்புகளை நீக்கவா? அவற்றின் சந்தாதாரர்கள் (இந்தத் தலைப்புகள் இல்லாமல்) இருப்பார்கள்; பிரச்சாரங்கள் இவற்றைப் பெறுநர்களாக இழக்கும். இதைத் திரும்பப் பெற முடியாது."
COM_OTTOMO_CONFIRM_DELETE_UNSUBSCRIBED="சந்தாவை நிறுத்திய அனைத்து முகவரிகளையும் (%s) நீக்கவா? இதைத் திரும்பப் பெற முடியாது, மேலும் அவர்கள் சந்தாவை நிறுத்தியது Ottomo-வுக்கு இனி தெரியாது: ஓர் இறக்குமதி அவற்றை மீண்டும் சேர்க்கக்கூடும்."
