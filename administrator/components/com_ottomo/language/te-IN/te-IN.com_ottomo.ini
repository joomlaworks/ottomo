COM_OTTOMO_WELCOME_DESCRIPTION="Ottomo తో మీరు ఇమెయిల్ ప్రచారాలను సులభంగా సృష్టించి నిర్వహించవచ్చు. <br /><a href='index.php?option=com_ottomo&amp;view=newsletters'>మీ మొదటి ప్రచారాన్ని ప్రారంభించడానికి</a> పై బటన్‌లపై క్లిక్ చేయండి, లేదా మరింత తెలుసుకోవడానికి <a href='#'>డాక్యుమెంటేషన్ చదవండి</a>."
COM_OTTOMO_WHY_MESSAGE="ఈ ఇమెయిల్ ఎందుకు"
COM_OTTOMO_WHY_MESSAGE_DESC="పాఠకులకు ఈ ఇమెయిల్ ఎందుకు వస్తోందో ప్రతి ఇమెయిల్‌లో చూపే లైన్‌ను భర్తీ చేస్తుంది (డిఫాల్ట్‌గా: “మీరు [సైట్ పేరు] లో [అంశాలు] కు సబ్‌స్క్రైబ్ చేసినందున ఈ ఇమెయిల్ మీకు వస్తోంది.”). చిరునామాలు వేరే చోట నుండి వచ్చినప్పుడు ఉపయోగకరం, ఉదా. మీ ఫోరమ్ లేదా మీ షాప్. ఇక్కడ ప్లేస్‌హోల్డర్‌లు పని చేస్తాయి: {{sitename}}, {{topics}}, {{firstname|there}}. ఖాళీగా ఉంటే: డిఫాల్ట్ లైన్."
