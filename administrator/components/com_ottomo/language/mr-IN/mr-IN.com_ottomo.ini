COM_OTTOMO_CONFIRM_DELETE_TOPICS="निवडलेले विषय हटवायचे? त्यांचे सबस्क्रायबर राहतील (या विषयांशिवाय), आणि मोहिमांमधून हे प्राप्तकर्ते म्हणून काढले जातील. हे पूर्ववत करता येणार नाही."
