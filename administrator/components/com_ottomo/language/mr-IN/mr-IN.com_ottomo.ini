COM_OTTOMO_CONFIRM_DELETE_SUBSCRIBERS="निवडलेले सबस्क्रायबर कायमचे हटवायचे? एखाद्याला ईमेल पाठवणे थांबवण्यासाठी त्यांना अक्षम करा: अनसबस्क्राइब केलेला पत्ता ठेवला जातो जेणेकरून त्याला पुन्हा कधीही ईमेल पाठवला जाणार नाही. हे पूर्ववत करता येणार नाही."
