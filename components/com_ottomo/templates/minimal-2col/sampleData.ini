title="The reading list"
subtitle="Hi {{firstname|there}}, our pick of the week: long reads, short notes and what is coming up next."
content="<h2 style='margin: 0 0 12px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 21px; line-height: 27px; font-weight: 700; color: #18181b;'>Why slow tools win</h2><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #3f3f46;'>The products we keep using are rarely the fastest. They are the ones that respect our attention. A few notes on designing for focus.</p><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #3f3f46; margin-bottom: 28px;'><a href='{{site}}' style='font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; color: #18181b; text-decoration: underline;'>Read more</a></p><h2 style='margin: 0 0 12px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 21px; line-height: 27px; font-weight: 700; color: #18181b;'>Notes from the studio</h2><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #3f3f46;'>What changed in our process this quarter, and the one meeting we stopped having.</p><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #3f3f46;'><a href='{{site}}' style='font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; color: #18181b; text-decoration: underline;'>Read more</a></p>"
sidebar="<p style='margin: 0 0 10px; font-size: 12px; line-height: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #71717a;'>In brief</p><p style='margin: 0 0 12px;'><strong style='color: #18181b;'>New:</strong> saved searches are here.</p><p style='margin: 0 0 12px;'><strong style='color: #18181b;'>Event:</strong> live Q&amp;A, Thursday at 17:00.</p><p style='margin: 0;'><a href='{{site}}' style='color: #18181b; font-weight: 600;'>All updates</a></p>"
