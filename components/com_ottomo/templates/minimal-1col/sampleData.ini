title="What we shipped this month"
subtitle="Hi {{firstname|there}}, here is a short round-up of the news, the stories and the small improvements of the last few weeks."
content="<h2 style='margin: 0 0 12px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 22px; line-height: 28px; font-weight: 700; color: #18181b;'>A calmer way to work</h2><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #3f3f46;'>We rebuilt the dashboard around the things you check every morning. Everything else is one click away, and nothing gets in your way.</p><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #3f3f46; margin-bottom: 32px;'><a href='{{site}}' style='font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; color: #18181b; text-decoration: underline;'>Read the story</a></p><h2 style='margin: 0 0 12px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 22px; line-height: 28px; font-weight: 700; color: #18181b;'>From the journal</h2><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #3f3f46;'>Three ideas from our team on writing emails people actually read: start with the reader, keep one call to action, and say less.</p><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 26px; color: #3f3f46;'><a href='{{site}}' style='font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; color: #18181b; text-decoration: underline;'>Read the article</a></p>"
