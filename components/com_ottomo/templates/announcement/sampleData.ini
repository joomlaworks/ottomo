logo="<img src='{{base}}images/logo.png' width='123' height='31' alt='Your Logo' style='display: inline-block; border: 0;' />"
title="We are moving to a new home"
content="<p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 17px; line-height: 27px; color: #44403c;'>Hi {{firstname|there}},</p><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 17px; line-height: 27px; color: #44403c;'>After ten years in the old place, we are opening the doors of our new studio next month: more light, more room, and a workshop space we can finally share with you.</p><p style='margin: 0 0 16px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 17px; line-height: 27px; color: #44403c;'>Nothing changes for your orders or your account. You will find everything where it was, just a little brighter.</p>"
cta="<table role='presentation' cellpadding='0' cellspacing='0' border='0'><tr><td style='border-radius: 8px; background: #1c1917;'><a href='{{site}}' style='display: inline-block; padding: 14px 28px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; line-height: 20px; color: #ffffff; text-decoration: none; border-radius: 8px;'>See the new studio</a></td></tr></table>"
signature="<p style='margin: 0;'>See you soon,</p><p style='margin: 0; font-weight: 700; color: #1c1917;'>Alex Morgan</p><p style='margin: 0; color: #78716c;'>Founder</p>"
social="<p style='margin: 0; text-align: center;'><a href='https://www.facebook.com/' style='display: inline-block; margin: 0 5px; text-decoration: none;'><img src='{{base}}images/social-facebook.png' width='24' height='24' alt='Facebook' style='display: block; border: 0;' /></a><a href='https://www.instagram.com/' style='display: inline-block; margin: 0 5px; text-decoration: none;'><img src='{{base}}images/social-instagram.png' width='24' height='24' alt='Instagram' style='display: block; border: 0;' /></a><a href='https://www.linkedin.com/' style='display: inline-block; margin: 0 5px; text-decoration: none;'><img src='{{base}}images/social-linkedin.png' width='24' height='24' alt='LinkedIn' style='display: block; border: 0;' /></a><a href='https://x.com/' style='display: inline-block; margin: 0 5px; text-decoration: none;'><img src='{{base}}images/social-twitter-x.png' width='24' height='24' alt='X' style='display: block; border: 0;' /></a><a href='https://www.youtube.com/' style='display: inline-block; margin: 0 5px; text-decoration: none;'><img src='{{base}}images/social-youtube.png' width='24' height='24' alt='YouTube' style='display: block; border: 0;' /></a></p>"
