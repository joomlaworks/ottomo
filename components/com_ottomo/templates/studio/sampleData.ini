feature="<p style='margin: 0 0 8px; font-size: 12px; line-height: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: #78716c;'>Behind the scenes</p><h2 style='margin: 0 0 12px; font-family: Georgia, Times New Roman, serif; font-size: 26px; line-height: 32px; font-weight: 400; color: #1c1917;'>Made by a small team, slowly</h2><p style='margin: 0 0 16px;'>Every piece starts on paper in our studio, then travels to a handful of workshops we have known for years.</p><a href='{{site}}' style='font-size: 15px; font-weight: 600; color: #1c1917;'>Meet the makers</a>"
